backend:
  name: github
  repo: devilikex/devilikex.github.io
  branch: main
media_folder: "images/uploads"
public_folder: "/images/uploads"
collections:
  - name: "updates_collection"
    label: "Updates"
    files:
      - file: "_data/updates.json"
        label: "Blog Updates"
        name: "blog_updates"
        fields:
          - label: "Blog Posts"
            name: "posts"
            widget: "list"
            fields:
              - {label: "ID", name: "id", widget: "hidden", default: "{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Publish Date", name: "date", widget: "datetime"}
              - {label: "Body", name: "body", widget: "markdown"}

      - file: "_data/mods_updates.json"
        label: "Shown Mods"
        name: "mods_posts_file"
        fields:
          - label: "Grid Cards Data"
            name: "posts"
            widget: "list"
            fields:
              - {label: "ID", name: "id", widget: "hidden", default: "{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Publish Date", name: "date", widget: "datetime"}
              - {label: "Body", name: "body", widget: "markdown"}
              
  - name: "config"
    label: "Site Settings"
    icon: "settings" # Displays a clean gear icon in Sveltia
    delete: false   # Safeguard so you don't accidentally delete your settings
    files:
      - name: "settings"
        label: "Global Settings"
        file: "settings.json" # Change this path to match your project directory
        format: "json-vars"
        fields:
          - label: "General Settings"
            name: "general_section"
            widget: "object"
            fields:
              - { label: "Site Title", name: "title", widget: "string", required: true }
              - { label: "Site Description (SEO)", name: "description", widget: "text" }
